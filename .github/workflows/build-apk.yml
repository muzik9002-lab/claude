name: Build Zombi Janglari APK
on:
  push:
    branches: [main]
    paths:
      - 'zombi-janglari/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: Android Debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zombi-janglari
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Zombi-Janglari-APK
          path: zombi-janglari/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
