<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"><meta name="theme-color" content="#071519">
<title>Zombi Janglari — So‘nggi Himoya</title>
<style>
:root {color-scheme:dark;--lime:#b6f66a;--muted:#9ab0a9;--ink:#071519}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--ink);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#f0faee;user-select:none;-webkit-user-select:none;touch-action:none}
canvas{display:block;width:100%;height:100%;touch-action:none}
#hud{position:fixed;inset:0;pointer-events:none}#hudTop{position:absolute;top:calc(12px + env(safe-area-inset-top));left:12px;right:12px;display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.hudBlock{background:rgba(4,20,24,.76);border:1px solid rgba(180,246,106,.18);border-radius:15px;padding:10px 12px;box-shadow:0 8px 25px #0005;backdrop-filter:blur(8px)}.hudLabel{font-size:10px;letter-spacing:1.6px;color:#a6c2b0;font-weight:850}.hudValue{font-size:21px;font-weight:1000;line-height:1.15;font-variant-numeric:tabular-nums}.hpTrack{height:7px;width:min(33vw,148px);background:#314344;border-radius:99px;margin-top:7px;overflow:hidden}.hpFill{height:100%;width:100%;background:linear-gradient(90deg,#fb655c,#ffc566);transition:width .2s}
#hudRight{text-align:right}#pause{position:absolute;right:12px;top:calc(91px + env(safe-area-inset-top));width:42px;height:42px;pointer-events:auto;border:1px solid #47655b;background:#092a2acb;border-radius:13px;color:white;font-weight:800;font-size:17px;cursor:pointer}
#joystick{position:absolute;left:18px;bottom:calc(22px + env(safe-area-inset-bottom));width:136px;height:136px;border-radius:50%;border:2px solid #badf9e55;background:#061f24b8;pointer-events:auto;touch-action:none;display:none}#stick{position:absolute;left:43px;top:43px;width:50px;height:50px;border-radius:50%;background:linear-gradient(135deg,#c9ff86,#72c99d);box-shadow:0 0 15px #b6f66a4a}
#fire{position:absolute;right:24px;bottom:calc(45px + env(safe-area-inset-bottom));width:98px;height:98px;background:linear-gradient(135deg,#f1a852,#e05c4e);border:5px solid #fbd7b9;border-radius:50%;font-size:34px;color:#201a15;font-weight:900;pointer-events:auto;touch-action:none;display:none;box-shadow:0 0 24px #ec945652}#fire:active{transform:scale(.94)}
#hint{position:absolute;bottom:calc(13px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);white-space:nowrap;font-size:11px;color:#e2e9d8aa;text-shadow:0 1px 4px #000}
#overlay{position:fixed;inset:0;display:grid;place-items:center;padding:20px;overflow:auto;background:linear-gradient(165deg,#061b1cdd,#041010f2);z-index:10}#overlay.hidden{display:none}.panel{width:min(100%,430px);max-height:95vh;overflow:auto;border:1px solid #abd57855;border-radius:27px;background:linear-gradient(160deg,#183230,#071c21);padding:26px 24px 22px;box-shadow:0 25px 100px #0009;text-align:center}.badge{display:inline-block;letter-spacing:2px;background:#b6f66a1c;color:#b6f66a;border:1px solid #b6f66a5c;font-size:10px;font-weight:900;padding:8px 14px;border-radius:50px}.hero{font-size:58px;line-height:1;margin:15px 0 6px}h1{font-size:clamp(30px,7vw,40px);margin:8px 0 4px;letter-spacing:-1.5px;line-height:1.05}h1 span{color:#b6f66a}.subtitle{font-size:14px;line-height:1.55;color:#b7cbc2;margin:14px auto 21px;max-width:330px}.stats{display:flex;gap:8px;justify-content:space-between;margin:16px 0 21px}.stat{flex:1;padding:13px 5px;background:#ffffff0a;border:1px solid #ffffff16;border-radius:13px}.stat b{display:block;font-size:23px;color:#dcffb8}.stat small{color:#9db7aa;font-size:10px;letter-spacing:.5px}.primary{appearance:none;border:0;border-radius:15px;background:linear-gradient(95deg,#b6f66a,#7ce2a6);color:#0c2a25;font-weight:950;font-size:16px;padding:16px 20px;width:100%;box-shadow:0 9px 30px #83e78630;cursor:pointer}.secondary{appearance:none;margin-top:10px;border:1px solid #799d87;background:transparent;border-radius:14px;color:#e2f3dc;font-size:14px;font-weight:750;padding:12px 18px;width:100%;cursor:pointer}.instructions{display:flex;justify-content:space-around;gap:10px;margin-top:18px;padding-top:14px;border-top:1px solid #ffffff1a;font-size:11px;line-height:1.5;color:#b3c7bd}.upgrades{display:grid;gap:9px;text-align:left;margin:17px 0}.upgrade{background:#d6ffb812;border:1px solid #a5ed873f;color:#effbe7;border-radius:14px;padding:14px;cursor:pointer;text-align:left}.upgrade strong{display:block;font-size:16px}.upgrade small{display:block;color:#bcd3be;margin-top:3px}#toast{position:fixed;left:50%;top:24%;transform:translateX(-50%);z-index:2;color:#edffca;font-weight:900;font-size:22px;text-shadow:0 3px 15px #000;pointer-events:none;opacity:0;transition:opacity .25s;white-space:nowrap}
@media (pointer:coarse){#joystick,#fire{display:block}#hint{display:none}}@media(max-height:630px){.panel{padding:15px}.hero{font-size:32px;margin:7px}h1{font-size:28px}.subtitle{margin:8px auto}.stats{margin:8px 0}.instructions{margin-top:8px;padding-top:7px}}@media (orientation:landscape) and (max-height:450px){#joystick{width:102px;height:102px;bottom:10px}#stick{left:32px;top:32px;width:38px;height:38px}#fire{width:80px;height:80px;bottom:16px}#hudTop{top:6px}}
</style>
</head>
<body>
<canvas id="game" aria-label="Zombi janglari o‘yin maydoni"></canvas>
<div id="hud"><div id="hudTop"><div class="hudBlock"><div class="hudLabel">❤️ JON</div><div class="hudValue"><span id="healthText">100</span><span style="font-size:12px;color:#a6c2b0"> / 100</span></div><div class="hpTrack"><div id="hpFill" class="hpFill"></div></div></div><div id="hudRight" class="hudBlock"><div class="hudLabel">🌊 TO‘LQIN <span id="waveText">1</span></div><div class="hudValue">⭐ <span id="scoreText">0</span></div><div style="font-size:11px;color:#c6d8cb">☠️ <span id="killsText">0</span> · 🔫 <span id="ammoText">12</span></div></div></div><button id="pause" aria-label="Pauza">Ⅱ</button><div id="joystick"><div id="stick"></div></div><button id="fire" aria-label="O‘q uzish">🎯</button><div id="hint">WASD / ← → ↑ ↓ : yurish · Sichqoncha: nishon · Bosish / Space: o‘q</div></div>
<div id="toast"></div><div id="overlay"><div class="panel" id="panel"></div></div>
<script>
(()=>{'use strict';
const c=document.getElementById('game'),ctx=c.getContext('2d',{alpha:false}),$=id=>document.getElementById(id);
const overlay=$('overlay'),panel=$('panel');let W=0,H=0,dpr=1,clock=0,last=0,state='menu',shake=0,fx=[],zombies=[],bullets=[],items=[],scenery=[];
let p={x:0,y:0,hp:100,maxhp:100,angle:0,inv:0,speed:210,damage:34,fireDelay:.24,shot:0,ammo:12,maxAmmo:12,reload:0},wave=1,score=0,kills=0,spawnRemaining=0,spawnCooldown=0,worldR=1200,move={x:0,y:0},fireHeld=false,aim={x:0,y:0,active:false},keys={},joystick={id:null,x:0,y:0},fireTouch=null,record=0;
try{record=Number(localStorage.getItem('zombi_janglari_record')||0)}catch(_){}
const rnd=(a,b)=>Math.random()*(b-a)+a,clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
let audio=null;function sound(freq=300,dur=.06,type='square',vol=.035){try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();let o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(freq,audio.currentTime);o.frequency.exponentialRampToValueAtTime(Math.max(40,freq*.54),audio.currentTime+dur);g.gain.setValueAtTime(vol,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+dur);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+dur)}catch(_){}}
function resize(){dpr=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=Math.round(W*dpr);c.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}window.addEventListener('resize',resize);resize();
function panelSet(html){panel.innerHTML=html;overlay.classList.remove('hidden')}
function welcome(){state='menu';panelSet(`<span class="badge">🧟 OFFLINE ARCADE · UZ</span><div class="hero">🧟‍♂️🔫</div><h1>ZOMBI <span>JANGLARI</span></h1><div class="subtitle">So‘nggi himoyachi sensan! Zombilardan omon qol, qurollarni kuchaytir va cheksiz to‘lqinlarni yeng.</div><div class="stats"><div class="stat"><b>${record}</b><small>🏆 REKORD</small></div><div class="stat"><b>∞</b><small>TO‘LQINLAR</small></div><div class="stat"><b>100</b><small>BOSHLANG‘ICH JON</small></div></div><button class="primary" id="go">▶ O‘YINNI BOSHLASH</button><div class="instructions"><span>📱 Telefon<br>Joystik + OTISH</span><span>💻 Kompyuter<br>WASD + Sichqoncha</span><span>🎁 Bonuslar<br>Jon + o‘q-dori</span></div>`);$('go').onclick=start}
function generateMap(){scenery=[];for(let i=0;i<250;i++){const x=rnd(-worldR,worldR),y=rnd(-worldR,worldR);if(Math.hypot(x,y)<200)continue;scenery.push({x,y,r:rnd(5,17),kind:Math.random()<.3?'rock':'bush',rot:rnd(0,6.28)})}}
function start(){p={x:0,y:0,hp:100,maxhp:100,angle:-Math.PI/2,inv:0,speed:210,damage:34,fireDelay:.24,shot:0,ammo:12,maxAmmo:12,reload:0};wave=1;score=0;kills=0;fx=[];zombies=[];bullets=[];items=[];clock=0;generateMap();overlay.classList.add('hidden');state='playing';startWave();updateHud();try{audio?.resume()}catch(_){}}
function toast(s){const t=$('toast');t.textContent=s;t.style.opacity=1;clearTimeout(toast.id);toast.id=setTimeout(()=>t.style.opacity=0,1100)}
function startWave(){spawnRemaining=5+wave*3;spawnCooldown=1.0;toast(`🌊 ${wave}-TO‘LQIN!`);sound(210,.24,'sawtooth',.022)}
function drop(x,y){let chance=Math.random();if(chance<.17)items.push({x,y,type:'heal',life:18,bob:rnd(0,6)});else if(chance<.39)items.push({x,y,type:'ammo',life:18,bob:rnd(0,6)});else if(chance<.5)items.push({x,y,type:'coin',life:18,bob:rnd(0,6)})}
function addFx(x,y,color,num=7,speed=110){for(let i=0;i<num;i++){const a=rnd(0,Math.PI*2),v=rnd(speed*.2,speed);fx.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:rnd(.2,.5),max:.5,color,size:rnd(2,5)})}}
function spawn(){let a=rnd(0,Math.PI*2),r=Math.max(W,H)*.65+90,typ=Math.random()<Math.min(.10+wave*.035,.36)?'fast':Math.random()<Math.min(.06+wave*.02,.24)?'tank':'normal';zombies.push({x:clamp(p.x+Math.cos(a)*r,-worldR+30,worldR-30),y:clamp(p.y+Math.sin(a)*r,-worldR+30,worldR-30),type:typ,hp:typ==='tank'?125+wave*9:typ==='fast'?42+wave*3:75+wave*5,max:typ==='tank'?125+wave*9:typ==='fast'?42+wave*3:75+wave*5,speed:(typ==='tank'?47:typ==='fast'?121:66)+Math.min(wave*3.5,43),r:typ==='tank'?23:typ==='fast'?13:17,t:rnd(0,10),attack:0})}
function shoot(){if(state!=='playing'||p.shot>0||p.reload>0)return;if(p.ammo<=0){p.reload=1.25;toast('🔄 QAYTA O‘QLANMOQDA');return}p.ammo--;p.shot=p.fireDelay;let angle=p.angle;if(aim.active&&!(matchMedia('(pointer:coarse)').matches)){const cx=W/2,cy=H/2;angle=Math.atan2(aim.y-cy,aim.x-cx)}else{let nearest=null,nd=500;for(const z of zombies){const d=dist(z,p);if(d<nd){nd=d;nearest=z}}if(nearest)angle=Math.atan2(nearest.y-p.y,nearest.x-p.x)}p.angle=angle;bullets.push({x:p.x+Math.cos(angle)*24,y:p.y+Math.sin(angle)*24,vx:Math.cos(angle)*720,vy:Math.sin(angle)*720,life:1.1,damage:p.damage});addFx(p.x+Math.cos(angle)*28,p.y+Math.sin(angle)*28,'#ffe8a0',4,80);shake=Math.max(shake,2);sound(260,.07,'sawtooth',.018);if(p.ammo===0)p.reload=1.25}
function update(dt){clock+=dt;p.shot=Math.max(0,p.shot-dt);p.inv=Math.max(0,p.inv-dt);if(p.reload>0){p.reload-=dt;if(p.reload<=0){p.ammo=p.maxAmmo;toast('🔫 TAYYOR!')}}
const kx=(keys.ArrowRight||keys.KeyD?1:0)-(keys.ArrowLeft||keys.KeyA?1:0),ky=(keys.ArrowDown||keys.KeyS?1:0)-(keys.ArrowUp||keys.KeyW?1:0);let vx=kx+move.x,vy=ky+move.y,len=Math.hypot(vx,vy);if(len>.07){vx/=Math.max(1,len);vy/=Math.max(1,len);p.x=clamp(p.x+vx*p.speed*dt,-worldR+25,worldR-25);p.y=clamp(p.y+vy*p.speed*dt,-worldR+25,worldR-25);if(!aim.active)p.angle=Math.atan2(vy,vx)}if(fireHeld||keys.Space)shoot();
spawnCooldown-=dt;if(spawnRemaining>0&&spawnCooldown<=0){spawn();spawnRemaining--;spawnCooldown=Math.max(.33,1.2-wave*.06)*rnd(.7,1.2)}
for(let i=zombies.length-1;i>=0;i--){const z=zombies[i],d=dist(z,p),ang=Math.atan2(p.y-z.y,p.x-z.x);z.t+=dt;z.attack=Math.max(0,z.attack-dt);if(d>z.r+15){z.x+=Math.cos(ang)*z.speed*dt;z.y+=Math.sin(ang)*z.speed*dt}else if(z.attack<=0){z.attack=.75;if(!p.inv){p.hp=Math.max(0,p.hp-(z.type==='tank'?24:12));p.inv=.55;shake=9;addFx(p.x,p.y,'#ff6c68',14);sound(110,.2,'sawtooth',.05);if(p.hp<=0){gameOver();return}}}}
for(let i=bullets.length-1;i>=0;i--){let b=bullets[i];b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;let hit=false;for(let j=zombies.length-1;j>=0;j--){let z=zombies[j];if(Math.hypot(z.x-b.x,z.y-b.y)<z.r+5){hit=true;z.hp-=b.damage;addFx(b.x,b.y,z.type==='tank'?'#db8be1':'#a0ec79',5);if(z.hp<=0){score+=z.type==='tank'?40:z.type==='fast'?20:10;kills++;drop(z.x,z.y);addFx(z.x,z.y,'#a8e57f',13,145);zombies.splice(j,1);sound(190,.09,'triangle',.028)}break}}if(hit||b.life<=0)bullets.splice(i,1)}
for(let i=items.length-1;i>=0;i--){let it=items[i];it.bob+=dt*4;it.life-=dt;if(dist(it,p)<28){if(it.type==='heal'){p.hp=Math.min(p.maxhp,p.hp+32);toast('❤️ +32 JON')}else if(it.type==='ammo'){p.ammo=p.maxAmmo;p.reload=0;toast('🔫 O‘Q-DORI')}else{score+=50;toast('🪙 +50 BALL')}sound(660,.15,'sine',.04);items.splice(i,1)}else if(it.life<=0)items.splice(i,1)}
for(let i=fx.length-1;i>=0;i--){let f=fx[i];f.x+=f.vx*dt;f.y+=f.vy*dt;f.vx*=.96;f.vy*=.96;f.life-=dt;if(f.life<=0)fx.splice(i,1)}if(spawnRemaining===0&&zombies.length===0){state='upgrade';upgradeMenu()}shake*=.86;updateHud()}
function updateHud(){$('healthText').textContent=Math.ceil(p.hp);$('hpFill').style.width=(p.hp/p.maxhp*100)+'%';$('waveText').textContent=wave;$('scoreText').textContent=score;$('killsText').textContent=kills;$('ammoText').textContent=p.reload>0?'↻':p.ammo}
function upgradeMenu(){let opts=[['❤️ Mustahkam qalqon','Maksimal jon +25 va 50 jon tiklash',()=>{p.maxhp+=25;p.hp=Math.min(p.maxhp,p.hp+50)}],['🔫 Kuchli o‘qlar','Har bir o‘q zarari +14',()=>p.damage+=14],['⚡ Tez harakat','Yurish tezligi +18%',()=>p.speed*=1.18],['🔥 Tez otish','Otish oralig‘i 14% qisqaradi',()=>p.fireDelay=Math.max(.085,p.fireDelay*.86)],['🎯 Katta magazin','O‘q sig‘imi +5',()=>{p.maxAmmo+=5;p.ammo=p.maxAmmo}]];opts.sort(()=>Math.random()-.5);panelSet(`<span class="badge">🏆 TO‘LQIN ${wave} YENGILDI</span><div class="hero">🎉</div><h1>QUROLNI <span>KUCHAYTIR!</span></h1><div class="subtitle">Keyingi to‘lqin uchun bir bonus tanla.</div><div class="upgrades">${opts.slice(0,3).map((o,i)=>`<button class="upgrade" data-up="${i}"><strong>${o[0]}</strong><small>${o[1]}</small></button>`).join('')}</div>`);panel.querySelectorAll('[data-up]').forEach(el=>el.onclick=()=>{opts[Number(el.dataset.up)][2]();wave++;overlay.classList.add('hidden');state='playing';p.hp=Math.min(p.maxhp,p.hp+5);startWave()})}
function gameOver(){state='over';if(score>record){record=score;try{localStorage.setItem('zombi_janglari_record',String(record))}catch(_){}}panelSet(`<span class="badge">☠️ O‘YIN TUGADI</span><div class="hero">🧟</div><h1>JASUR <span>HIMOYACHI!</span></h1><div class="subtitle">Bu safar zombilar ustun keldi. Yana urinib ko‘r!</div><div class="stats"><div class="stat"><b>${score}</b><small>⭐ BALL</small></div><div class="stat"><b>${kills}</b><small>☠️ ZOMBI</small></div><div class="stat"><b>${record}</b><small>🏆 REKORD</small></div></div><button class="primary" id="again">↻ QAYTA BOSHLASH</button><button class="secondary" id="home">BOSH MENYU</button>`);$('again').onclick=start;$('home').onclick=welcome}
function pause(){if(state==='playing'){state='paused';panelSet(`<span class="badge">⏸ PAUZA</span><div class="hero">🛡️</div><h1>O‘YIN <span>TO‘XTADI</span></h1><div class="subtitle">Hozirgi hisob: ${score} ball · ${wave}-to‘lqin</div><button id="resume" class="primary">▶ DAVOM ETISH</button><button id="restart" class="secondary">↻ QAYTA BOSHLASH</button>`);$('resume').onclick=()=>{overlay.classList.add('hidden');state='playing'};$('restart').onclick=start}else if(state==='paused'){$('resume').click()}}
function draw(){ctx.fillStyle='#102c2c';ctx.fillRect(0,0,W,H);let camx=p.x-W/2,camy=p.y-H/2;ctx.save();ctx.translate(-camx+(Math.random()-.5)*shake,-camy+(Math.random()-.5)*shake);
ctx.fillStyle='#163937';ctx.fillRect(-worldR,-worldR,worldR*2,worldR*2);let grid=80;ctx.lineWidth=1;ctx.strokeStyle='#96b89312';for(let x=Math.floor((camx-100)/grid)*grid;x<camx+W+100;x+=grid){ctx.beginPath();ctx.moveTo(x,Math.max(-worldR,camy-100));ctx.lineTo(x,Math.min(worldR,camy+H+100));ctx.stroke()}for(let y=Math.floor((camy-100)/grid)*grid;y<camy+H+100;y+=grid){ctx.beginPath();ctx.moveTo(Math.max(-worldR,camx-100),y);ctx.lineTo(Math.min(worldR,camx+W+100),y);ctx.stroke()}
ctx.strokeStyle='#d6e88a';ctx.lineWidth=7;ctx.strokeRect(-worldR,-worldR,worldR*2,worldR*2);
for(const s of scenery){if(Math.abs(s.x-p.x)>W/2+40||Math.abs(s.y-p.y)>H/2+40)continue;ctx.save();ctx.translate(s.x,s.y);ctx.rotate(s.rot);if(s.kind==='bush'){ctx.fillStyle='#294b3a';for(let a=0;a<3;a++){ctx.beginPath();ctx.arc(Math.cos(a*2.1)*s.r*.45,Math.sin(a*2.1)*s.r*.45,s.r*.8,0,7);ctx.fill()}ctx.fillStyle='#3e7250';ctx.beginPath();ctx.arc(-3,-3,s.r*.5,0,7);ctx.fill()}else{ctx.fillStyle='#395653';ctx.beginPath();ctx.ellipse(0,0,s.r,s.r*.65,0,0,7);ctx.fill();ctx.strokeStyle='#71948c';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-4,-2);ctx.lineTo(2,-5);ctx.stroke()}ctx.restore()}
